<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>2DQH 비품 — 비품 대여 관리</title>
  <link rel="stylesheet" href="style.css?v=20261105_14">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#inventory">
    <img src="logo_2dqh.jpg" alt="2DQH" class="brand-img-logo">
    <span class="brand-sep" aria-hidden="true"></span>
    <span class="brand-sub">비품</span>
  </a>
  <div class="top-actions">
    <button id="btnToggleSearch" class="btn-toggle-search" aria-label="검색 및 카테고리 필터 열기/닫기" type="button" title="검색">
      <span class="search-btn-icon" aria-hidden="true">🔍</span>
      <span class="search-btn-label">검색</span>
    </button>
    <span id="connection" class="pill hidden"></span>
    <button id="loginBtn" class="btn desktop-only">관리자 로그인</button>
    <button id="logoutBtn" class="btn hidden">로그아웃</button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" aria-label="주 메뉴">
    <button class="nav active" data-view="inventory">전체 비품</button>
    <button class="nav" data-view="loans">대여 현황</button>
    <button class="nav admin-only hidden" data-view="dashboard">대시보드</button>
    <button class="nav admin-only hidden" data-view="history">대여 이력</button>
    <button class="nav hidden" data-view="consumables">소모품 재고</button>
  </nav>

  <main>
    <!-- 홈 뷰 (비활성화 - 전체 비품 목록으로 통합) -->
    <section class="view hidden" id="view-home">
      <div class="home">
        <div class="home-head">
          <h1>비품실</h1>
        </div>
        <button class="home-btn primary-action" id="homeBorrow" type="button">
          <span class="home-txt"><b>대여 신청</b><small>사용 가능한 비품을 대여합니다</small></span>
        </button>
        <button class="home-btn" id="homeReturn" type="button">
          <span class="home-txt"><b>반납 처리</b><small>대여 중인 비품을 반납합니다</small></span>
          <span class="home-count" id="homeLoanCount"></span>
        </button>
        <button class="home-btn accent hidden" id="homeReorder" type="button">
          <span class="home-txt"><b>구매요청</b></span>
          <span class="home-count" id="homeLowCount"></span>
        </button>
        <div class="home-links">
          <button class="text-btn" type="button" data-goto="inventory">전체 비품 목록 보기</button>
          <button class="text-btn" type="button" data-goto="loans">현재 대여 현황</button>
        </div>
      </div>
    </section>

    <!-- 전체 비품 뷰 -->
    <section class="view active" id="view-inventory">
      <div class="page-head hide-mobile">
        <div class="head-title">
          <h1>전체 비품</h1>
          <span class="count-badge" id="inventoryCountBadge">0</span>
        </div>
        <div class="head-actions">
          <button class="btn admin-only hidden" id="addAsset">＋ 비품 등록</button>
        </div>
      </div>
      <section class="panel">
        <div id="searchFilterCollapsible" class="search-collapsible-panel">
          <div class="toolbar">
            <div class="search-input-box">
              <span class="search-input-icon" aria-hidden="true">🔍</span>
              <input id="assetSearch" aria-label="비품 검색" placeholder="비품명, 이니셜(m=멀티미터), 위치 검색...">
              <button id="btnClearSearch" class="btn-clear-search hidden" type="button" aria-label="검색어 지우기">✕</button>
            </div>
            <select id="assetFilter" aria-label="비품 상태 필터" class="hide-mobile">
              <option value="all">모든 상태</option>
              <option value="available">사용 가능</option>
              <option value="borrowed">대여 중</option>
              <option value="maintenance">수리 중</option>
            </select>
          </div>
          <div id="inventoryCategories" class="inventory-categories"></div>
        </div>
        <div id="inventoryRows" class="table-wrap"></div>
      </section>
    </section>

    <!-- 대여 현황 뷰 -->
    <section class="view" id="view-loans">
      <div class="page-head">
        <div class="head-title">
          <button class="back-link-btn" id="btnBackToInventory" type="button">← 비품 목록</button>
          <h1>대여 현황</h1>
          <span class="count-badge" id="activeLoansCountBadge">0</span>
        </div>
        <button class="btn primary" id="loanAdd">대여 신청</button>
      </div>
      <section class="panel">
        <div class="toolbar">
          <input id="loanSearch" aria-label="대여 검색" placeholder="비품명, 식별번호, 대여자 검색...">
          <select id="loanFilter" aria-label="대여 상태 필터">
            <option value="active">대여 중</option>
            <option value="all">전체</option>
            <option value="returned">반납 완료</option>
          </select>
        </div>
        <div id="loanRows" class="table-wrap"></div>
      </section>
    </section>

    <!-- 대시보드 뷰 (관리자) -->
    <section class="view admin-only hidden" id="view-dashboard">
      <div class="page-head">
        <div class="head-title">
          <h1>운영 대시보드</h1>
        </div>
        <button class="btn primary" id="quickBorrow">＋ 대여</button>
      </div>
      
      <!-- 핵심 통계 지표 -->
      <div class="metrics" id="metrics"><div class="metric">데이터 집계 중...</div></div>
      <div id="lowStockNotice"></div>

      <!-- 통계 차트 위젯 -->
      <section class="panel chart-panel">
        <div class="panel-head">
          <b>📊 인기 비품 TOP 5 & 평균 대여 기간</b>
          <span class="stat-badge" id="statTotalLoans">총 대여 0건</span>
        </div>
        <div class="chart-container" style="position: relative; height: 220px; padding: 12px 16px;">
          <canvas id="topAssetsChart"></canvas>
        </div>
      </section>

      <div class="grid2">
        <section class="panel">
          <div class="panel-head">
            <b>반납 임박 비품</b>
            <button class="text-btn" data-goto="loans">전체 보기</button>
          </div>
          <div id="dashboardLoans" class="table-wrap"></div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <b>최근 활동 기록</b>
            <button class="text-btn" data-goto="history">이력 보기</button>
          </div>
          <div id="recentActivity" class="activity"></div>
        </section>
      </div>
    </section>

    <!-- 대여 이력 뷰 (관리자) -->
    <section class="view admin-only hidden" id="view-history">
      <div class="page-head">
        <div class="head-title">
          <h1>대여 이력</h1>
        </div>
        <button class="btn" id="exportCsv">CSV 내보내기</button>
      </div>
      <section class="panel">
        <div class="toolbar">
          <input id="historySearch" aria-label="이력 검색" placeholder="비품명, 식별번호, 대여자 검색...">
        </div>
        <div id="historyRows"></div>
      </section>
    </section>

    <!-- 소모품 재고 뷰 (기본 숨김) -->
    <section class="view hidden" id="view-consumables">
      <div class="page-head">
        <h1>소모품 재고</h1>
      </div>
      <div id="consumableRows" class="table-wrap"></div>
    </section>

    <!-- 모바일 전용 보조 링크 (대여 현황 및 관리자 기능 격리) -->
    <footer class="mobile-sub-footer">
      <button type="button" class="text-link-sub" id="btnToggleLoans">대여 현황 전체보기</button>
      <span class="sub-dot">·</span>
      <button type="button" class="text-link-sub" id="btnMobileLogin">관리자 로그인</button>
    </footer>
  </main>
</div>

<!-- 대화상자 모달 -->
<div id="modalBackdrop" class="backdrop">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">대여</h2>
      <button class="icon-btn" id="closeModal" aria-label="닫기"><span aria-hidden="true">×</span></button>
    </div>
    <form id="modalForm">
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-modal-cancel" id="cancelModal">취소</button>
        <button class="btn primary btn-modal-save" type="submit" id="saveModal">대여 신청</button>
      </div>
    </form>
  </section>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- 모바일 전용 하단 바 (QR 버튼 제거, 대여/반납 전용) -->
<div class="mobile-bar" id="mobileBar" aria-label="모바일 퀵 메뉴">
  <button class="mobile-action primary" id="mobileBorrow" type="button">대여 신청</button>
  <button class="mobile-action" id="mobileReturn" type="button">반납 처리</button>
</div>

<script src="app.js?v=20261105_14"></script>
</body>
</html>
