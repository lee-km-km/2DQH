name: Daily LabStock Overdue Reminder

on:
  schedule:
    # 매일 한국 시간(KST) 오전 9시 정각 실행 (UTC 00:00)
    - cron: '0 0 * * *'
  # 관리자가 GitHub Actions 탭에서 수동 실행 가능
  workflow_dispatch:

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Overdue Loans and Send Alert
        uses: actions/github-script@v7
        env:
          SUPABASE_URL: "https://nngownhoxrtymzvwscyc.supabase.co"
          SUPABASE_KEY: "sb_publishable_ijsPGWswYcZKdhrjoy4hSw_9jRaQGbv"
          WEBHOOK_URL: ${{ secrets.DISCORD_OR_SLACK_WEBHOOK_URL }}
        with:
          script: |
            const { SUPABASE_URL, SUPABASE_KEY, WEBHOOK_URL } = process.env;
            if (!WEBHOOK_URL) {
              console.log('DISCORD_OR_SLACK_WEBHOOK_URL 시크릿이 설정되지 않아 알림 발송을 건너뜁니다.');
              return;
            }

            try {
              // 1. 미반납 대여 목록 조회
              const resLoans = await fetch(`${SUPABASE_URL}/rest/v1/loans?returned_at=is.null&select=*`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
              });
              const loans = await resLoans.json();

              // 2. 비품 마스터 조회
              const resAssets = await fetch(`${SUPABASE_URL}/rest/v1/assets?select=id,name,location`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
              });
              const assets = await resAssets.json();
              const assetMap = Object.fromEntries(assets.map(a => [a.id, a.name]));

              // 3. 3일 이상 연체 비품 필터링
              const now = Date.now();
              const overdueList = loans.filter(l => {
                const borrowedTime = new Date(l.borrowed_at).getTime();
                return (now - borrowedTime) > (3 * 24 * 60 * 60 * 1000);
              });

              if (overdueList.length === 0) {
                console.log('현재 3일 이상 연체된 비품이 없습니다.');
                return;
              }

              // 4. 슬랙/디스코드 요약 메시지
              const lines = overdueList.map(l => {
                const name = assetMap[l.asset_id] || l.asset_id;
                const days = Math.floor((now - new Date(l.borrowed_at).getTime()) / (24 * 60 * 60 * 1000));
                return `• **[${name}]** (${l.asset_id}) — 대여자: **${l.borrower_name}** (${days}일째 미반납)`;
              }).join('\n');

              const content = `⚠️ **[LabStock] 연구실 장기 미반납 비품 알림 (${overdueList.length}건)**\n\n현재 3일 이상 반납되지 않은 비품 목록입니다. 해당 연구원은 조속히 반납해 주세요:\n\n${lines}\n\n👉 [비품 관리 바로가기](https://lee-km-km.github.io/2DQH-equipment)`;

              await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content, text: content })
              });

              console.log(`성공적으로 ${overdueList.length}건의 연체 알림을 발송했습니다.`);
            } catch(err) {
              console.error('웹훅 알림 발송 실패:', err);
            }
